<script>
(function () {
  var supported = ["en","ru","uk","es","cs"];
  var fallback = "en";
  var pick = null;
  try { pick = window.localStorage.getItem("ivm-lang"); } catch (e) {}
  if (supported.indexOf(pick) === -1) {
    /* Берём ТОЛЬКО главный язык браузера, а не первый попавшийся из списка.

       Перебор по всему списку выдавал русский людям, которые его туда
       вообще не ставили первым: у поляка список обычно pl, ru, en — своего
       языка у нас нет, польский пропускался, и человек получал русскую
       версию, потому что она оказывалась выше английской. То же у литовца,
       латыша, эстонца, немца — у всех, кто держит русский вторым. Для сайта,
       который продаёт в Европу, это худшая из возможных первых секунд.

       Теперь так: язык браузера совпал с одним из наших — отдаём его;
       не совпал — английский. Русский видит тот, у кого он и стоит главным,
       то есть русскоязычный, а не сосед по региону. Осознанный выбор
       переключателем при этом сильнее всего: он прочитан выше, из ivm-lang. */
    var langs = navigator.languages || [navigator.language || fallback];
    var primary = String(langs[0] || fallback).slice(0, 2).toLowerCase();
    if (supported.indexOf(primary) !== -1) pick = primary;
  }
  if (supported.indexOf(pick) === -1) pick = fallback;
  window.location.replace("./" + pick + "/");
})();
</script>
