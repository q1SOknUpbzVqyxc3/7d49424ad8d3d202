server {
    server_name ironvane-media.com www.ironvane-media.com;

    root  /var/www/ironvane-media;
    index index.html;

    charset utf-8;
    server_tokens off;
    access_log /var/log/nginx/access.log ironvane_anon;

    include snippets/ironvane-headers.conf;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml application/rss+xml
                    image/svg+xml application/manifest+json;

    # A multi-page site: an unknown path must say so, not silently serve the
    # root, which here is the language redirect.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        include snippets/ironvane-headers.conf;
    }

    # The one dynamic route. Everything else is a file on disk.
    location = /api/lead {
        limit_req  zone=ivm_lead burst=3 nodelay;
        limit_conn ivm_conn 5;
        include snippets/ironvane-headers.conf;
        client_max_body_size 64k;   # the handler caps at 12 KB; this stops the
                                    # oversized body before PHP is even started
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.3-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME /var/www/ironvane-media/api/lead.php;
        fastcgi_param  SCRIPT_NAME     /api/lead;
        fastcgi_read_timeout 30s;
    }

    # Nothing else on this site is a program.
    location ~ \.php$ { return 404; }

    # A year, immutable -- and deliberately WITHOUT "always". Without it the
    # header lands only on a 2xx/3xx, so a mistyped asset name gets the 404
    # page uncached. With "always" that 404 would be pinned in the visitor's
    # browser for a year with no way for them to clear it. worker.js had the
    # same rule for the same reason.
    location ^~ /assets/ {
        limit_req  zone=ivm_site burst=60 nodelay;
        include snippets/ironvane-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
        access_log off;
    }

    # Hidden files are never content.
    location ~ /\. { deny all; }

    # Страницы всегда переспрашивают сервер. Без Cache-Control браузер
    # кеширует эвристически, и правка контента доезжает не до всех. Ответ
    # при отсутствии изменений -- 304 и пустое тело, то есть почти даром.
    # Файлов в /assets/ не касается: у них годовой кеш и штамп версии.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        limit_req  zone=ivm_site burst=40 nodelay;
        limit_conn ivm_conn 25;
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ironvane-media.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ironvane-media.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# Port 80 exists only to send visitors to port 443. Certbot generated its own
# version of this block and, being generated, it carried neither the header
# snippet nor server_tokens -- so every cleartext response leaked the nginx
# version and none of the six headers. worker.js hardened the redirect too.
#
# A Host we do not serve gets a bare 404 rather than a redirect, which is what
# Certbot's block did and is worth keeping: it stops the server bouncing
# arbitrary hostnames pointed at this IP. Split into two blocks rather than an
# `if ($host ...)` because server_name is what nginx is for.
server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log ironvane_anon;
    return 404;
}

server {
    listen      80;
    listen [::]:80;
    server_name ironvane-media.com www.ironvane-media.com;

    server_tokens off;
    access_log /var/log/nginx/access.log ironvane_anon;
    include snippets/ironvane-headers.conf;

    # 301 only for the methods that carry nothing. Anything else gets 308,
    # which tells the browser to retry with the SAME method. Under Certbot's
    # blanket 301 a form POST arriving over http was converted to a GET, which
    # writes the sender's name, email, Telegram handle and message into the
    # address bar, their history, and every log the request passes through.
    # That is the exact failure the redirect exists to prevent, and worker.js
    # chose 308 deliberately for it.
    if ($request_method ~ ^(GET|HEAD)$) {
        return 301 https://$host$request_uri;
    }
    return 308 https://$host$request_uri;
}
