# The six headers worker.js sent on every response. "always" so they are on
# error responses too. HSTS deliberately has no includeSubDomains: it would pin
# every future subdomain to HTTPS for a year with no way to undo it.
add_header X-Content-Type-Options    "nosniff"                                   always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"           always;
add_header X-Frame-Options           "SAMEORIGIN"                                always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"  always;
add_header Strict-Transport-Security "max-age=31536000"                          always;
add_header Content-Security-Policy   $ironvane_csp                               always;
