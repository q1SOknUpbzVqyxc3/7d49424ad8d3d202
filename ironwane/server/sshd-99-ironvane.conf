# Password login was switched off during setup because the provider's original
# root password had been pasted into a chat log. The owner asked for it back on
# 2026-08-26: he wants to be able to get in without the key file.
#
# It is on with fail2ban in front rather than on its own. A root password on a
# public IP is probed continuously by automated scanners -- that is the ambient
# condition of every VPS, not a prediction -- and the current password is 28
# random characters, so the exposure is noise and log volume rather than a
# realistic guess. fail2ban turns the noise off.
#
# Key auth still works and is still the better door: ssh -i ~/.ssh/ironvane_ed25519
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin yes
