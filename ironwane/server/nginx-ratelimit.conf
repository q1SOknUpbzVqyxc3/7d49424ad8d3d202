# Пороги частоты. Считаются по НАСТОЯЩЕМУ адресу: nginx держит его в памяти
# ($binary_remote_addr), и на это не влияет то, что в лог пишется
# обезличенный. Поэтому ограничение работает точно, а на диск адрес всё равно
# не попадает.
#
# Зачем это вообще. За сутки на сайт приходит около трёх тысяч запросов, и
# 2600 из них -- чужие сканеры, перебирающие адреса в поисках уязвимостей.
# Пока их немного, они безвредны; при всплеске одного ядра не хватит.

limit_req_zone  $binary_remote_addr zone=ivm_site:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ivm_lead:5m  rate=6r/m;
limit_conn_zone $binary_remote_addr zone=ivm_conn:10m;

# 429 вместо 503: «слишком часто» -- это про клиента, а не про сбой сервера,
# и поисковик, получив 503, начинает считать сайт неисправным.
limit_req_status  429;
limit_conn_status 429;
