# Only documents execute anything, so only documents get a CSP -- the same rule
# harden() applied in worker.js. An empty value makes nginx omit the header.
map $sent_http_content_type $ironvane_csp {
    default     "";
    ~^text/html "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'";
}
